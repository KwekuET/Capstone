  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header id="site-header">
    <div class="logo">Corvane Cloud Systems</div>
    <nav id="main-nav">
      <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="billing.html">Billing</a></li>

      </ul>

  <main id="page">
    <h1>Forgot UserID/Password</h1>
    <p class="note">Enter your Company ID or work email. If it matches an account, we'll send a reset link.</p>
    {{MESSAGE}}

    <form method="POST" action="forgot-password">
      <label for="account">Company ID or email</label>
      <input type="text" id="account" name="account">
      <button type="submit" class="button">Send reset link</button>
    </form>

    <p><a href="index.html">Back to sign in</a></p>
  </main>
